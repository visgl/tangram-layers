name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Run lint
        run: yarn lint
      - name: Check TypeScript
        run: yarn typecheck

  test-node:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Run dev-tools Node tests
        run: yarn test-node

  test-headless:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Install Chromium
        run: yarn dlx playwright install --with-deps chromium
      - name: Run dev-tools headless browser tests
        run: yarn test-headless

  test-coverage:
    name: Renderer coverage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Build test worker
        run: yarn test-build-worker
      - name: Install Chromium
        run: yarn dlx playwright install --with-deps chromium
      - name: Collect Node coverage blob
        run: |
          mkdir -p .vitest-reports
          yarn test-node --coverage --reporter=blob --outputFile.blob=.vitest-reports/node.json
      - name: Collect browser coverage blob
        run: yarn test-coverage --reporter=blob --outputFile.blob=.vitest-reports/headless.json
      - name: Merge coverage and enforce renderer thresholds
        run: >-
          yarn vitest --config vitest.config.js
          --merge-reports=.vitest-reports
          --coverage
          --coverage.reportsDirectory=coverage
          --coverage.thresholds.statements=30
          --coverage.thresholds.branches=25
          --coverage.thresholds.functions=35
          --coverage.thresholds.lines=30
      - name: Publish coverage to job summary
        if: always()
        run: node scripts/write-coverage-summary.mjs
      - name: Publish renderer coverage to Coveralls
        if: success()
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false
      - name: Upload renderer coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-coverage
          path: coverage/
          if-no-files-found: error

  test-legacy:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Run legacy Karma browser tests
        run: yarn test-run-headless

  test-website:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build
      - name: Build documentation website
        run: yarn test-website

name: Deploy deck demo to GitHub Pages

on:
  push:
    branches:
      - ib/tangram-on-webgpu
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble demo site
        run: |
          mkdir -p _site/demos/deck _site/demos/fonts _site/demos/images _site/dist
          cp demos/deck/app.js demos/deck/index.html demos/deck/main.css demos/deck/tangram-layer.js _site/demos/deck/
          cp demos/fonts/montserrat.woff _site/demos/fonts/
          cp demos/images/wheel.png _site/demos/images/
          cp dist/tangram.debug.mjs _site/dist/
          cp robots.txt _site/robots.txt
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

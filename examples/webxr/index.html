<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Tangram WebXR globe</title>
    <link rel="stylesheet" href="./main.css">
  </head>
  <body class="tangram-webxr-standalone">
    <main id="webxr-container">
      <canvas id="webxr-canvas"></canvas>
      <div class="webxr-device-tabs" role="tablist" aria-label="Rendering device">
        <button type="button" data-webxr-device="webgl" role="tab">WebGL 2</button>
        <button type="button" data-webxr-device="webgpu" role="tab">WebGPU</button>
      </div>
      <aside class="webxr-panel">
        <h1>Tangram WebXR globe</h1>
        <p id="webxr-status" role="status">Preparing the renderer…</p>
        <div class="webxr-actions">
          <button id="webxr-enter" type="button" disabled>Enter VR</button>
          <button id="webxr-exit" type="button" hidden>Exit VR</button>
        </div>
        <p class="webxr-hint">
          This experimental example renders one Tangram scene into the per-eye framebuffers and
          camera matrices supplied by luma.gl.
        </p>
      </aside>
      <p class="webxr-attribution">
        &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>
      </p>
    </main>
    <script type="importmap">
      {
        "imports": {
          "@luma.gl/core": "https://esm.sh/@luma.gl/core@9.4.0-beta.3?bundle",
          "@luma.gl/engine": "https://esm.sh/@luma.gl/engine@9.4.0-beta.3?bundle&external=@luma.gl/core,@math.gl/core",
          "@luma.gl/experimental": "https://esm.sh/@luma.gl/experimental@9.4.0-beta.3?bundle&external=@luma.gl/core,@math.gl/core",
          "@luma.gl/webgl": "https://esm.sh/@luma.gl/webgl@9.4.0-beta.3?bundle&external=@luma.gl/core",
          "@luma.gl/webgpu": "https://esm.sh/@luma.gl/webgpu@9.4.0-beta.3?bundle&external=@luma.gl/core",
          "@math.gl/core": "https://esm.sh/@math.gl/core@4.1.0?bundle",
          "@vis.gl/tangram-renderer": "../../modules/tangram-renderer/dist/index.js?webxr=1"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>

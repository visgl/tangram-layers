scene:
  background:
    # Let the Leaflet CARTO layer show through outside the preview geometry.
    color: [0.024, 0.043, 0.094, 0]

cameras:
  perspective:
    type: perspective
    active: true

sources:
  preview:
    type: GeoJSON
    url: ../data/crosshatch-preview.geojson

layers:
  land:
    data: {source: preview}
    filter: {kind: land}
    draw:
      polygons:
        order: 0
        # Keep the preview geometry translucent so the real CARTO basemap
        # remains visible underneath it.
        color: [0.063, 0.106, 0.192, 0.28]

  buildings:
    data: {source: preview}
    filter: {kind: building}
    draw:
      polygons:
        order: 1
        color: [0.09, 0.161, 0.267, 0.68]
        extrude: true

  roads:
    data: {source: preview}
    filter: {kind: road}
    draw:
      lines:
        order: 2
        color: '#27d7ff'
        alpha: 0.9
        width: 8px
        outline:
          color: '#8c3dff'
          width: 2px

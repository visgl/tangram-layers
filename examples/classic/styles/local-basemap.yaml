scene:
  background:
    # Let the Leaflet CARTO layer show through outside the preview geometry.
    color: [0.875, 0.906, 0.925, 0]

cameras:
  perspective:
    type: perspective
    active: true

sources:
  preview:
    type: GeoJSON
    url: ../data/crosshatch-preview.geojson

layers:
  land:
    data: {source: preview}
    filter: {kind: land}
    draw:
      polygons:
        order: 0
        color: [0.933, 0.945, 0.929, 0.32]

  buildings:
    data: {source: preview}
    filter: {kind: building}
    draw:
      polygons:
        order: 1
        color: '#c6cdd5'
        extrude: true

  roads:
    data: {source: preview}
    filter: {kind: road}
    draw:
      lines:
        order: 2
        color: '#788692'
        width: 8px
